<!doctype html><html><body style="margin:0;background:#0b0c14">
<canvas id="c" width="1100" height="1400"></canvas>
<script>
const W=900,H=240;
const ctx=document.getElementById('c').getContext('2d');
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${Math.max(0,Math.min(1,a))})`;
const mix=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f].map(Math.round);
const WHITE=[255,255,255], BLACK=[0,0,0];
const fract=x=>x-Math.floor(x);
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function glow(x,y,r,c,a){if(r<=0.5)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(1,rgba(c,0));ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();}
function strokePath(path,style,width,plus,cap='round'){ctx.save();if(plus)ctx.globalCompositeOperation='lighter';ctx.strokeStyle=style;ctx.lineWidth=width;ctx.lineCap=cap;ctx.lineJoin='round';ctx.stroke(path);ctx.restore();}
function fillPath(path,style,plus){ctx.save();if(plus)ctx.globalCompositeOperation='lighter';ctx.fillStyle=style;ctx.fill(path);ctx.restore();}
function neon(path,c,w,a=1){strokePath(path,rgba(c,0.10*a),w*7,true);strokePath(path,rgba(c,0.45*a),w*2.4,true);strokePath(path,rgba(mix(c,WHITE,0.7),0.95*a),w*0.8,false);}
function round(l,t,r,b,rad){const p=new Path2D();p.roundRect(l,t,r-l,b-t,rad);return p;}
function chamfer(l,t,r,b,c){const p=new Path2D();p.moveTo(l+c,t);p.lineTo(r-c,t);p.lineTo(r,t+c);p.lineTo(r,b-c);p.lineTo(r-c,b);p.lineTo(l+c,b);p.lineTo(l,b-c);p.lineTo(l,t+c);p.closePath();return p;}
function pointed(l,t,r,b,pt){const cy=(t+b)/2,p=new Path2D();p.moveTo(l+pt,t);p.lineTo(r-pt,t);p.lineTo(r,cy);p.lineTo(r-pt,b);p.lineTo(l+pt,b);p.lineTo(l,cy);p.closePath();return p;}
// sample a polygon/roundrect outline as points (for runners and arcs): approximate rounded capsule outline
function capsulePts(l,t,r,b,n){const pts=[];const rad=(b-t)/2,cy=(t+b)/2;const straight=(r-l-2*rad);const per=2*straight+2*Math.PI*rad;for(let i=0;i<n;i++){let d=i/n*per;let x,y;if(d<straight){x=l+rad+d;y=t;}else if((d-=straight)<Math.PI*rad){const a=-Math.PI/2+d/rad;x=r-rad+Math.cos(a)*rad;y=cy+Math.sin(a)*rad;}else if((d-=Math.PI*rad)<straight){x=r-rad-d;y=b;}else{d-=straight;const a=Math.PI/2+d/rad;x=l+rad+Math.cos(a)*rad;y=cy+Math.sin(a)*rad;}pts.push([x,y]);}return pts;}
function rectPts(l,t,r,b,n){const per=2*(r-l)+2*(b-t);const pts=[];for(let i=0;i<n;i++){let d=i/n*per;if(d<r-l)pts.push([l+d,t]);else if((d-=r-l)<b-t)pts.push([r,t+d]);else if((d-=b-t)<r-l)pts.push([r-d,b]);else{d-=r-l;pts.push([l,b-d]);}}return pts;}
function glass(path,C,t0,b0){fillPath(path,(()=>{const g=ctx.createLinearGradient(0,t0,0,b0);g.addColorStop(0,rgba(mix(C.d,C.p,0.25),0.92));g.addColorStop(1,rgba(mix(C.d,BLACK,0.5),0.95));return g;})());fillPath(path,(()=>{const g=ctx.createLinearGradient(0,t0,0,(t0+b0)/2);g.addColorStop(0,'rgba(255,255,255,0.14)');g.addColorStop(1,'rgba(255,255,255,0)');return g;})());}
function sparkle(x,y,s,c,a){if(a<0.02)return;const p=new Path2D();p.moveTo(x,y-s);p.quadraticCurveTo(x,y,x+s,y);p.quadraticCurveTo(x,y,x,y+s);p.quadraticCurveTo(x,y,x-s,y);p.quadraticCurveTo(x,y,x,y-s);fillPath(p,rgba(c,a),true);glow(x,y,s*1.4,c,a*0.5);}

// ---------------- SYSTEM window
function system(w,h,t,C){
 const l=w*0.05,r=w*0.95,tp=h*0.24,b=h*0.8,bh=b-tp,cy=(tp+b)/2;
 const body=new Path2D();const c=bh*0.16;body.moveTo(l+c,tp);body.lineTo(r,tp);body.lineTo(r,b-c);body.lineTo(r-c,b);body.lineTo(l,b);body.lineTo(l,tp+c);body.closePath();
 glass(body,C,tp,b);
 ctx.save();ctx.clip(body);
 // hex grid
 const hs=bh*0.18;for(let row=0;row<8;row++)for(let col=0;col<40;col++){const x=l+col*hs*1.5,y=tp+row*hs*0.87+(col%2)*hs*0.43;const hx=new Path2D();for(let k=0;k<6;k++){const a=k*Math.PI/3;const px=x+Math.cos(a)*hs*0.5,py=y+Math.sin(a)*hs*0.5;k?hx.lineTo(px,py):hx.moveTo(px,py);}hx.closePath();strokePath(hx,rgba(C.p,0.06),1,true);}
 // scan line
 const sx=l+(r-l)*fract(t*0.35);const g=ctx.createLinearGradient(sx-bh,0,sx,0);g.addColorStop(0,rgba(C.p,0));g.addColorStop(1,rgba(C.p,0.35));ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(sx-bh,tp,bh,bh);ctx.fillStyle=rgba(mix(C.p,WHITE,.6),0.8);ctx.fillRect(sx-1.5,tp,3,bh);
 ctx.restore();
 const glitch=(fract(t*0.27)>0.96);
 if(glitch){ctx.save();ctx.translate(4,0);strokePath(body,rgba(C.s,0.8),2,true);ctx.restore();ctx.save();ctx.translate(-4,0);strokePath(body,rgba([80,255,255],0.6),2,true);ctx.restore();}
 neon(body,C.p,2.4);
 // header tab
 const hw=w*0.17,th=h*0.12;const tab=new Path2D();tab.moveTo(w/2-hw-th,tp);tab.lineTo(w/2-hw,tp-th);tab.lineTo(w/2+hw,tp-th);tab.lineTo(w/2+hw+th,tp);tab.closePath();
 fillPath(tab,rgba(mix(C.d,C.p,0.35),0.95));neon(tab,C.p,1.6);
 for(let i=-1;i<=1;i++){const x=w/2+i*hw*0.45,y=tp-th*0.5;const on=((Math.floor(t*3)%3)===i+1);const d=new Path2D();const s=th*0.22;d.moveTo(x,y-s);d.lineTo(x+s,y);d.lineTo(x,y+s);d.lineTo(x-s,y);d.closePath();fillPath(d,rgba(on?WHITE:C.p,on?1:0.6),true);if(on)glow(x,y,s*4,C.p,0.7);}
 // brackets
 const pulse=0.55+0.45*Math.sin(t*3);const g2=h*0.045,arm=bh*0.5;
 [[l-g2,tp-g2,1,1],[r+g2,tp-g2,-1,1],[l-g2,b+g2,1,-1],[r+g2,b+g2,-1,-1]].forEach(([x,y,sx,sy])=>{const p=new Path2D();p.moveTo(x+sx*arm,y);p.lineTo(x,y);p.lineTo(x,y+sy*arm*0.6);neon(p,C.p,2.6,pulse);});
 // side meters
 for(const side of [-1,1]){const x0=side<0?l+bh*0.18:r-bh*0.18;for(let k=0;k<5;k++){const hh=bh*(0.12+0.25*(0.5+0.5*Math.sin(t*6+k*1.3+side)));const x=x0+side*-k*bh*0.09;ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(C.p,0.55);ctx.fillRect(x-bh*0.025,cy+bh*0.3-hh,bh*0.05,hh);ctx.restore();}}
}

// ---------------- HALO
function halo(w,h,t,C){
 const l=w*0.06,r=w*0.94,tp=h*0.26,b=h*0.74,bh=b-tp,cx=w/2,cy=(tp+b)/2;
 // rays
 ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<28;i++){const a=i/28*Math.PI*2+t*0.15;const len=w*0.55;const p=new Path2D();p.moveTo(cx,cy);p.lineTo(cx+Math.cos(a-0.02)*len,cy+Math.sin(a-0.02)*len*0.45);p.lineTo(cx+Math.cos(a+0.02)*len,cy+Math.sin(a+0.02)*len*0.45);p.closePath();const g=ctx.createRadialGradient(cx,cy,0,cx,cy,len);g.addColorStop(0,rgba(C.p,0.22*(0.6+0.4*Math.sin(t*2+i))));g.addColorStop(1,rgba(C.p,0));ctx.fillStyle=g;ctx.fill(p);}ctx.restore();
 const body=round(l,tp,r,b,bh/2);glass(body,C,tp,b);
 // gradient border shifting
 const off=fract(t*0.2);const g=ctx.createLinearGradient(l,0,r,0);g.addColorStop(0,rgba(C.p,1));g.addColorStop(off,rgba(C.s,1));g.addColorStop(Math.min(1,off+0.15),rgba(WHITE,1));g.addColorStop(1,rgba(C.p,1));
 strokePath(body,rgba(C.p,0.12),18,true);strokePath(body,g,4.5,false);
 strokePath(round(l+9,tp+9,r-9,b-9,(bh-18)/2),rgba(WHITE,0.45),1.2,false);
 // comets
 const pts=capsulePts(l,tp,r,b,400);
 for(let k=0;k<3;k++){const head=fract(t*0.18+k/3);for(let j=0;j<40;j++){const f=head-j*0.0025;const pt=pts[Math.floor(fract(f)*pts.length)];const a=(1-j/40);glow(pt[0],pt[1],(j?6:16)*a+2,j?C.p:WHITE,a*(j?0.5:0.9));}}
 // end orbs
 for(const ex of [l,r]){const pu=0.6+0.4*Math.sin(t*3+ex);glow(ex,cy,bh*0.7*pu,C.p,0.6);glow(ex,cy,bh*0.18,WHITE,0.95);}
}

// ---------------- ARCANE
function arcane(w,h,t,C){
 const l=w*0.13,r=w*0.87,tp=h*0.3,b=h*0.7,bh=b-tp,cy=(tp+b)/2;
 const body=round(l,tp,r,b,bh/2);glass(body,C,tp,b);
 // flowing energy lines on top & bottom
 for(const y of [tp,b]){const p=new Path2D();p.moveTo(l+bh*0.4,y);p.lineTo(r-bh*0.4,y);ctx.save();ctx.setLineDash([18,14]);ctx.lineDashOffset=-t*80;neon(p,C.p,2.2);ctx.restore();
  const s=new Path2D();for(let x=l+bh*0.5;x<=r-bh*0.5;x+=4){const yy=y+Math.sin(x*0.04+t*4)*bh*0.12*(y===tp?-1:1);x===l+bh*0.5?s.moveTo(x,yy):s.lineTo(x,yy);}strokePath(s,rgba(C.s,0.6),1.4,true);}
 // circles
 [l,r].forEach((ex,k)=>{const R=h*0.42,dir=k?-1:1;glow(ex,cy,R*1.4,C.p,0.35);
  const c0=new Path2D();c0.arc(ex,cy,R*0.8,0,7);fillPath(c0,rgba(mix(C.d,BLACK,0.4),0.9));
  ctx.save();ctx.translate(ex,cy);ctx.rotate(t*0.7*dir);
  const ring=new Path2D();ring.arc(0,0,R,0,7);neon(ring,C.p,1.8);const ring2=new Path2D();ring2.arc(0,0,R*0.8,0,7);neon(ring2,C.p,1);
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2;const q=new Path2D();q.moveTo(Math.cos(a)*R*0.83,Math.sin(a)*R*0.83);q.lineTo(Math.cos(a)*R*(i%3?0.9:0.97),Math.sin(a)*R*(i%3?0.9:0.97));strokePath(q,rgba(mix(C.p,WHITE,.5),0.9),1.3,true);}
  ctx.restore();ctx.save();ctx.translate(ex,cy);ctx.rotate(-t*1.1*dir);
  for(const st of [0,Math.PI]){const tri=new Path2D();for(let i=0;i<4;i++){const a=st-Math.PI/2+i*2*Math.PI/3;const x=Math.cos(a)*R*0.68,y=Math.sin(a)*R*0.68;i?tri.lineTo(x,y):tri.moveTo(x,y);}neon(tri,C.s,1.2);}
  ctx.restore();glow(ex,cy,R*0.35*(0.8+0.3*Math.sin(t*4)),WHITE,0.9);});
 // motes rising
 const rd=rng(3);for(let i=0;i<30;i++){const age=fract(t*0.3+rd());const x=l+(r-l)*rd();const y=b-age*h*0.9;glow(x,y,4,C.p,(1-age)*0.8);}
}

// ---------------- STORM
function storm(w,h,t,C){
 const l=w*0.06,r=w*0.94,tp=h*0.24,b=h*0.76,bh=b-tp;
 const body=chamfer(l,tp,r,b,bh*0.25);glass(body,C,tp,b);
 const flash=Math.pow(Math.max(0,Math.sin(t*2.3)),20);
 neon(body,C.p,1.6,0.5+flash*0.8);
 const pts=rectPts(l,tp,r,b,600);const tick=Math.floor(t*12);
 for(let k=0;k<4;k++){const rd=rng(tick*7+k+1);const start=Math.floor(rd()*pts.length);const len=60+Math.floor(rd()*110);const p=new Path2D();for(let i=0;i<=len;i+=6){const q=pts[(start+i)%pts.length];const jx=(rd()-0.5)*bh*0.22,jy=(rd()-0.5)*bh*0.22;i?p.lineTo(q[0]+jx,q[1]+jy):p.moveTo(q[0],q[1]);
   if(rd()<0.08){const br=new Path2D();br.moveTo(q[0]+jx,q[1]+jy);let bx=q[0]+jx,by=q[1]+jy;for(let s=0;s<3;s++){bx+=(rd()-0.5)*bh*0.4;by+=(rd()-0.5)*bh*0.4;br.lineTo(bx,by);}neon(br,C.p,0.8,0.7);}}
  neon(p,C.p,1.6,0.9);}
 glow(w/2,(tp+b)/2,w*0.5,C.p,0.15*flash);
}

// ---------------- INFERNO
function inferno(w,h,t,C){
 const l=w*0.07,r=w*0.93,tp=h*0.36,b=h*0.76,bh=b-tp;
 const fire=mix(C.p,[255,140,40],0.25);
 const n=34;ctx.save();ctx.globalCompositeOperation='lighter';
 for(let layer=0;layer<3;layer++)for(let i=0;i<n;i++){const f=i/(n-1);const x=l+(r-l)*f;const hg=bh*(0.55+0.4*Math.sin(f*9+layer))*(0.7+0.3*Math.sin(t*(6+layer)+i*1.9))*(1-layer*0.28);const sw=Math.sin(t*3+i)*bh*0.1;const wd=bh*0.3;const p=new Path2D();p.moveTo(x-wd,tp+4);p.quadraticCurveTo(x-wd*0.5,tp-hg*0.5,x+sw,tp-hg);p.quadraticCurveTo(x+wd*0.5,tp-hg*0.4,x+wd,tp+4);p.closePath();const g=ctx.createLinearGradient(0,tp-hg,0,tp+4);const col=[fire,mix(fire,[255,220,120],0.5),WHITE][layer];g.addColorStop(0,rgba(col,0));g.addColorStop(0.6,rgba(col,0.55));g.addColorStop(1,rgba(mix(col,WHITE,0.4),0.9));ctx.fillStyle=g;ctx.fill(p);}
 ctx.restore();
 const body=round(l,tp,r,b,bh*0.3);glass(body,C,tp,b);neon(body,fire,2.2);
 const rd=rng(9);for(let i=0;i<40;i++){const age=fract(t*0.6+rd());const x=l+(r-l)*rd()+Math.sin(t*2+i)*10;const y=tp-age*tp;glow(x,y,3+3*rd(),mix(fire,WHITE,0.4),(1-age));}
 for(const ex of [l,r]){glow(ex,(tp+b)/2,bh*0.9,fire,0.5+0.2*Math.sin(t*7+ex));}
}

// ---------------- FROST
function frost(w,h,t,C){
 const l=w*0.1,r=w*0.9,tp=h*0.28,b=h*0.74,bh=b-tp,cy=(tp+b)/2;
 const ice=mix(C.p,[200,240,255],0.55);
 const body=chamfer(l,tp,r,b,bh*0.3);glass(body,C,tp,b);neon(body,ice,1.8);
 const rd=rng(4);
 function shard(x,y,a,len){const dx=Math.cos(a),dy=Math.sin(a),px=-dy,py=dx;const mx=x+dx*len*0.35,my=y+dy*len*0.35;const p=new Path2D();p.moveTo(x,y);p.lineTo(mx+px*len*0.12,my+py*len*0.12);p.lineTo(x+dx*len,y+dy*len);p.lineTo(mx-px*len*0.12,my-py*len*0.12);p.closePath();const g=ctx.createLinearGradient(x,y,x+dx*len,y+dy*len);g.addColorStop(0,rgba(WHITE,0.95));g.addColorStop(0.5,rgba(ice,0.85));g.addColorStop(1,rgba(mix(ice,C.d,0.4),0.9));fillPath(p,g);strokePath(p,rgba(WHITE,0.7),1,false);const fl=new Path2D();fl.moveTo(x,y);fl.lineTo(x+dx*len,y+dy*len);strokePath(fl,rgba(WHITE,0.8),0.8,false);}
 [[l,tp,-1,-1],[r,tp,1,-1],[l,b,-1,1],[r,b,1,1]].forEach(([x,y,sx,sy],k)=>{for(let i=0;i<7;i++){const base=Math.atan2(sy,sx);const a=base+(rd()-0.5)*1.6;const grow=0.85+0.15*Math.sin(t*1.5+k+i);shard(x-sx*bh*0.05,y-sy*bh*0.05,a,bh*(0.25+0.4*rd())*grow);}});
 for(let i=0;i<10;i++){const x=l+(r-l)*(0.15+0.07*i);shard(x,tp,-Math.PI/2+(rd()-0.5)*0.6,bh*(0.12+0.18*rd()));}
 // refraction sweep
 const sx=l+(r-l)*fract(t*0.25);ctx.save();ctx.clip(body);const g=ctx.createLinearGradient(sx-60,0,sx+60,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,0.3)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(sx-60,tp,120,bh);ctx.restore();
 for(let i=0;i<8;i++){const x=l+(r-l)*fract(i*0.37),y=tp+bh*fract(i*0.61);sparkle(x,y,7,WHITE,Math.pow(0.5+0.5*Math.sin(t*2+i*2),6));}
}

// ---------------- PRISM
function prism(w,h,t,C){
 const l=w*0.05,r=w*0.95,tp=h*0.28,b=h*0.72,bh=b-tp,cy=(tp+b)/2;
 const body=pointed(l,tp,r,b,bh*0.55);glass(body,C,tp,b);
 // facets
 const f=new Path2D();f.moveTo(l+bh*0.55,tp);f.lineTo(l+bh*1.1,cy);f.lineTo(l+bh*0.55,b);f.moveTo(r-bh*0.55,tp);f.lineTo(r-bh*1.1,cy);f.lineTo(r-bh*0.55,b);f.moveTo(l+bh*1.1,cy);f.lineTo(l,cy);f.moveTo(r-bh*1.1,cy);f.lineTo(r,cy);strokePath(f,rgba(WHITE,0.25),1,true);
 const cols=[C.p,C.s,[255,255,255],mix(C.p,C.s,0.5)];const g=ctx.createLinearGradient(l,tp,r,b);for(let i=0;i<=8;i++){g.addColorStop(i/8,rgba(cols[(i+Math.floor(t*2))%cols.length],1));}
 strokePath(body,rgba(C.p,0.15),16,true);strokePath(body,g,4,false);strokePath(body,'rgba(255,255,255,0.6)',1,false);
 ctx.save();ctx.clip(body);for(let i=0;i<6;i++){const x=l+(r-l)*fract(i*0.23+t*0.05*(i%2?1:-1)),y=cy+Math.sin(t+i)*bh*0.3;glow(x,y,bh*0.6,cols[i%cols.length],0.18);}ctx.restore();
 for(const [x,ph] of [[l,0],[r,2]]){sparkle(x,cy,bh*0.4*(0.7+0.3*Math.sin(t*3+ph)),WHITE,0.9);glow(x,cy,bh*0.6,C.p,0.5);}
}

// ---------------- VOID
function voidf(w,h,t,C){
 const l=w*0.12,r=w*0.88,tp=h*0.28,b=h*0.72,bh=b-tp,cy=(tp+b)/2;
 [l,r].forEach((ex,k)=>{const rd=rng(11+k);glow(ex,cy,h*0.5,C.p,0.35);for(let i=0;i<120;i++){const life=1.5+rd()*2;const age=fract(t/life+rd());const dist=h*0.12+h*0.35*(1-age);const a=rd()*6.28+age*6*(k?-1:1);glow(ex+Math.cos(a)*dist,cy+Math.sin(a)*dist*0.7,2.5,age>0.7?mix(C.p,WHITE,0.6):C.p,age*0.9);}
  const hole=new Path2D();hole.arc(ex,cy,h*0.12,0,7);fillPath(hole,'#000');strokePath(hole,rgba(mix(C.p,WHITE,0.5),0.9),2,true);});
 const body=round(l+h*0.1,tp,r-h*0.1,b,bh*0.3);fillPath(body,'rgba(4,4,8,0.92)');
 strokePath(body,rgba(C.p,0.25),14,true);strokePath(body,rgba(C.p,0.9),2,true);
 const pts=capsulePts(l+h*0.1,tp,r-h*0.1,b,300);for(let i=0;i<24;i++){const f=fract(t*0.15+i/24);const pt=pts[Math.floor(f*pts.length)];glow(pt[0],pt[1],5,C.s,0.6);}
}

// ---------------- WINGS OF LIGHT
function lightwings(w,h,t,C){
 const l=w*0.25,r=w*0.75,tp=h*0.3,b=h*0.72,bh=b-tp,cy=(tp+b)/2;
 const beat=Math.sin(t*2.4)*0.12;
 for(const side of [-1,1]){const ax=side<0?l+bh*0.3:r-bh*0.3,ay=cy;for(let i=0;i<9;i++){const deg=(-50+i*12)*Math.PI/180+beat*(1-i/9);const a=side<0?Math.PI-deg:deg;const len=h*(0.95-i*0.055)*1.0;const dx=Math.cos(a),dy=Math.sin(a);const px=-dy,py=dx;const p=new Path2D();p.moveTo(ax,ay);p.quadraticCurveTo(ax+dx*len*0.5+px*len*0.18*side*-1,ay+dy*len*0.5+py*len*0.18*side*-1,ax+dx*len,ay+dy*len);neon(p,i%2?C.s:C.p,1.6,0.9-i*0.05);sparkle(ax+dx*len,ay+dy*len,6,WHITE,0.5+0.5*Math.sin(t*4+i));}}
 const body=round(l,tp,r,b,bh*0.35);glass(body,C,tp,b);neon(body,C.p,2);
 glow(w/2,tp,bh*0.5,WHITE,0.6);sparkle(w/2,tp,bh*0.25,WHITE,0.9);
}

// ---------------- STAR CROWN
function starcrown(w,h,t,C){
 const l=w*0.08,r=w*0.92,tp=h*0.4,b=h*0.78,bh=b-tp,cx=w/2;
 const body=round(l,tp,r,b,bh*0.4);glass(body,C,tp,b);
 const rd=rng(21);const stars=[];for(let i=0;i<11;i++){const f=i/10;const x=l+bh*0.6+(r-l-bh*1.2)*f;const y=tp-h*0.05-Math.sin(f*Math.PI)*h*0.26+(rd()-0.5)*h*0.05;stars.push([x,y]);}
 const reveal=fract(t*0.12)*1.3*stars.length;
 for(let i=0;i<stars.length-1;i++){const a=Math.max(0,Math.min(1,reveal-i));if(a<=0)break;const [x0,y0]=stars[i],[x1,y1]=stars[i+1];const p=new Path2D();p.moveTo(x0,y0);p.lineTo(x0+(x1-x0)*a,y0+(y1-y0)*a);neon(p,C.p,0.9,0.8);}
 stars.forEach(([x,y],i)=>{sparkle(x,y,(i===5?16:8)*(0.8+0.2*Math.sin(t*3+i)),i%2?C.s:WHITE,0.95);});
 neon(body,C.p,2);
 // shooting star
 const st=fract(t*0.18);if(st<0.35){const k=st/0.35;const x=l+(r-l)*k,y=h*0.1+k*h*0.15;const p=new Path2D();p.moveTo(x,y);p.lineTo(x-80,y-15);strokePath(p,(()=>{const g=ctx.createLinearGradient(x,y,x-80,y-15);g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(1,'rgba(255,255,255,0)');return g;})(),2,true);glow(x,y,8,WHITE,0.9);}
}
