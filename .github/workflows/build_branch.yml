name: Build branch APK
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1

      # Same key for every build, so each new APK installs over the previous one
      - name: Use fixed signing key
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/signing/manhwa-dev.jks"
            echo "storePassword=manhwadev"
            echo "keyAlias=manhwa"
            echo "keyPassword=manhwadev"
          } > keystore.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' -A3 build.log | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      # Prints the name and package read from inside the APK, so it is clear which build it is
      - name: Verify app name and package
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-universal-debug.apk \
            | grep -E "^package:|^application-label:|^application:" | tee badging.txt
          {
            echo "## MANHWA build ${{ github.run_number }}"
            echo '```'
            cat badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: MANHWA-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
