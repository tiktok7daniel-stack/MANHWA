name: Build branch APK
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # MANHWA: write to publish each build's APK as a release (outside the small artifact storage)
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1
        with:
          # MANHWA: builds run on work branches, not main; without this the Gradle cache is only read there and never
          # saved, so every build compiled everything again. Saved, the next build reuses what did not change.
          cache-read-only: false

      # Same key for every build, so each new APK installs over the previous one
      - name: Use fixed signing key
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/signing/manhwa-dev.jks"
            echo "storePassword=manhwadev"
            echo "keyAlias=manhwa"
            echo "keyPassword=manhwadev"
          } > keystore.properties

      # MANHWA novels: the Piper voice engine (sherpa-onnx, Apache-2.0) for the phone's ABI, from its official release.
      # Without it the app still builds; listening with Piper then says it is not in this build.
      - name: Add the Piper engine (sherpa-onnx)
        continue-on-error: true
        run: |
          set -e
          V=1.12.14
          curl -fsSL -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-v$V-android.tar.bz2"
          mkdir -p sherpa && tar xjf sherpa.tar.bz2 -C sherpa
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp sherpa/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a
          echo "PIPER_LIBS_ADDED"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug -Pmanhwa.phoneOnly --stacktrace 2>&1 | tee build.log

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' -A3 build.log | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          # MANHWA: kept briefly, the free artifact storage is small
          retention-days: 3

      # Prints the name and package read from inside the APK, so it is clear which build it is
      - name: Verify app name and package
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            | grep -E "^package:|^application-label:|^application:" | tee badging.txt
          {
            echo "## MANHWA build ${{ github.run_number }}"
            echo '```'
            cat badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # MANHWA: proves each APK installs: a valid signature (and which key), 16 KB-aligned native libraries for new
      # phones, the package, version and SDK levels, and the native code inside
      - name: Check the APKs can be installed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            for f in app/build/outputs/apk/debug/*.apk; do
              echo "== $(basename "$f") $(stat -c %s "$f") bytes"
              "$BT"/apksigner verify --verbose --print-certs "$f" 2>&1 | grep -E "Verifies|Verified using|Signer #1 certificate (DN|SHA-256)|WARNING|ERROR" | head -12
              "$BT"/zipalign -c -P 16 4 "$f" && echo "zipalign 16K: OK" || echo "zipalign 16K: FAILED"
              "$BT"/aapt2 dump badging "$f" 2>&1 | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|^ERROR" | head -6
              unzip -l "$f" | grep -c "\.so$" | sed 's/^/native libs: /'
            done
          } 2>&1 | tee apkcheck.txt
          { echo '## APK install check'; echo '```'; cat apkcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: MANHWA-build-${{ github.run_number }}
          # MANHWA: only the phone's APK, kept a week: every build kept 90 days filled the free storage quota
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 7

      # MANHWA: the unit tests of the app (key health, sources, organizer, translation rules)
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest -Pmanhwa.phoneOnly --stacktrace 2>&1 | tee test.log

      # MANHWA: the phone's APK published as a release of its own (a direct download link, kept, and outside the
      # artifact storage quota), once the build and the tests passed
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="MANHWA-build-${{ github.run_number }}-arm64.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$apk"
          gh release create "$tag" "$apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "MANHWA build ${{ github.run_number }}" \
            --notes "Branch ${{ github.ref_name }}, commit ${{ github.sha }}"
          { echo '## APK (arm64)'; echo "https://github.com/${{ github.repository }}/releases/download/$tag/$apk"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Test results in summary
        if: always()
        run: |
          {
            echo '## Unit tests'
            total=0; failed=0
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); total=$((total + t))
              x=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); failed=$((failed + x))
            done
            echo "Tests: $total, failed: $failed"
            if [ "$failed" != "0" ] || [ ! -d app/build/test-results ]; then
              echo '```'
              grep -E 'FAILED|AssertionError|expected|but was|e: ' -A3 test.log | head -n 80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
