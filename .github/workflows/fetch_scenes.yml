name: Fetch background scenes
on:
  workflow_dispatch:
    inputs:
      target:
        description: How many scenes in all
        default: '100'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch, check and add the scenes
        env:
          SCENES_TARGET: ${{ inputs.target }}
        run: python tools/fetch_scenes.py
      - name: Commit them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi app/src/main/java/eu/kanade/presentation/manga/components/GeneratedScenes.kt tools/scenes.json docs/SCENES_CREDITS.md
          git commit -m "Background scenes from free sources [skip ci]" || echo "nothing new"
          git push
